name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Optional: suppress warnings if any action still internally uses Node.js 20
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo (latest version)
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Node.js (explicitly use 24)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Run unit tests with Jest
      - name: Run Jest tests
        run: npm test -- --ci --reporters=default --reporters=jest-junit

      # Upload test results (latest version)
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: jest-results
          path: ./junit.xml

      # SonarCloud Scan (latest stable version)
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=md-sadidtahsin_assignment-14
            -Dsonar.organization=md-sadidtahsin
            -Dsonar.sources=.
            -Dsonar.tests=tests
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
