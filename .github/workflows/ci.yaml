name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true   # ✅ allow deprecated Node.js

jobs:

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 1   # 
          vuln-type: os,library
          severity: HIGH,CRITICAL

  build-test-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install  --ignore-scripts

      - name: Run Jest tests
        run: npm test -- --ci --reporters=default --reporters=jest-junit

      - name: Upload test results
        uses: actions/upload-artifact@v4   # ✅ updated version
        with:
          name: jest-results
          path: ./junit.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0 # Or current stable SHA update
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=md-sadidtahsin_assignment-14
            -Dsonar.organization=md-sadidtahsin
            -Dsonar.sources=.
            -Dsonar.tests=tests
            -Dsonar.exclusions=tests/**
            -Dsonar.test.inclusions=tests/**/*.test.js
            -Dsonar.exclusions=**/node_modules/**,**/vendor/**,**/dist/**,**/build/**
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

# -Dsonar.qualitygate.wait=true